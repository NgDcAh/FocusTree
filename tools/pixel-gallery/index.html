<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171515">
<title>Pixel Art Gallery</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header class="topbar"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="brand-copy"><strong>PIXEL ART</strong><span>LOCAL GALLERY</span></div><div class="top-meta"><span id="asset-count">Scanning artwork…</span><span class="live-dot">LOCAL</span></div><button id="refresh" class="refresh-button" type="button"><span class="refresh-icon">↻</span><span>Refresh</span></button></header>
<main><section class="intro"><div><p class="eyebrow">YOUR ARTWORK LIBRARY</p><h1>Pixel Art Gallery</h1><p class="intro-copy">Browse sprites, scenes, sheets, and animation frames generated by PXL.</p></div><div class="build-state" id="build-state"><span class="state-dot"></span><span>Indexing files</span></div></section>
<section class="toolbar" aria-label="Gallery filters"><label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search assets or sources…" autocomplete="off"></label><label class="select-wrap"><span class="sr-only">Filter by asset type</span><select id="kind-filter"><option value="all">All asset types</option><option value="sprite">Sprites</option><option value="scene">Scenes</option><option value="sheet">Sheets</option><option value="sheet-frame">Sheet frames</option><option value="animation">Animations</option><option value="animation-frame">Animation frames</option><option value="generated output">Other outputs</option></select></label><div id="filter-count" class="filter-count"></div></section>
<div id="warnings" class="warnings" hidden></div><section id="gallery" class="gallery" aria-live="polite"><div class="loading-state"><span class="spinner"></span><span>Scanning artwork folders…</span></div></section>
<footer><span>Pixel Art Gallery</span><span>Files stay on this computer · PXL generated</span></footer></main>
<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title"><button class="viewer-backdrop" data-close aria-label="Close preview"></button><section class="viewer-panel"><header class="viewer-header"><div><p class="eyebrow" id="viewer-source"></p><h2 id="viewer-title"></h2></div><button class="close-button" data-close aria-label="Close preview">×</button></header><div class="viewer-stage" id="viewer-stage"></div><div class="viewer-controls"><label>Zoom <strong id="zoom-value">4×</strong><input id="zoom" type="range" min="1" max="16" value="4" step="1"></label><span id="image-info"></span></div><div id="frame-picker" class="frame-picker" hidden></div></section></div>
<script src="/app.js" defer></script></body></html>
